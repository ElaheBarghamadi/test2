[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "examora-backend"
version = "0.1.0"
description = "Django backend foundation for Examora"
requires-python = ">=3.12"
dependencies = [
  "Django>=5.1,<5.3",
  "djangorestframework>=3.15,<3.17",
  "djangorestframework-simplejwt>=5.3,<5.6",
  "django-cors-headers>=4.5,<4.8",
  "dj-database-url>=2.2,<3.1",
  "psycopg[binary]>=3.2,<3.4",
  "python-dotenv>=1.0,<1.2",
]

[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
